name: license-server-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-license_server}
      POSTGRES_USER: ${POSTGRES_USER:-license_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - license-postgres:/var/lib/postgresql
    user: postgres
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    networks:
      - db

  app:
    # No build section here on purpose: production pulls the image the release-image.yml
    # workflow already publishes to GHCR on every version tag, instead of rebuilding on the
    # server. See docker-up-prod.sh, which runs `compose pull` before `compose up`.
    image: ghcr.io/${GHCR_OWNER:-repasscloud}/${IMAGE_NAME:-license-server-app}:${IMAGE_TAG:?Set IMAGE_TAG in .env.prod}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Container
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-license_server};Username=${POSTGRES_USER:-license_app};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      SEED_DEFAULT_ADMIN: ${SEED_DEFAULT_ADMIN:-false}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:?Set DEFAULT_ADMIN_EMAIL in .env.prod}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?Set DEFAULT_ADMIN_PASSWORD in .env.prod}
      SEED_DEMO_LICENSE: ${SEED_DEMO_LICENSE:-false}
      Licensing__IdTimeZone: ${LICENSE_ID_TIME_ZONE:-Australia/Adelaide}
      Licensing__DefaultSigningKey: ${LICENSE_DEFAULT_SIGNING_KEY:?Set LICENSE_DEFAULT_SIGNING_KEY in .env.prod}
      ActivationCodes__Pepper: ${ACTIVATION_CODE_PEPPER:?Set ACTIVATION_CODE_PEPPER in .env.prod}
      ApiCredentials__Pepper: ${API_CREDENTIAL_PEPPER:?Set API_CREDENTIAL_PEPPER in .env.prod}
      DeploymentKeys__Pepper: ${DEPLOYMENT_KEY_PEPPER:?Set DEPLOYMENT_KEY_PEPPER in .env.prod}
      MailerSend__ApiToken: ${MAILERSEND_API_TOKEN:?Set MAILERSEND_API_TOKEN in .env.prod}
      MailerSend__FromEmail: ${MAILERSEND_FROM_EMAIL:?Set MAILERSEND_FROM_EMAIL in .env.prod}
      MailerSend__FromName: ${MAILERSEND_FROM_NAME:-License Server}
      MailerSend__WebhookSecret: ${MAILERSEND_WEBHOOK_SECRET:?Set MAILERSEND_WEBHOOK_SECRET in .env.prod}
      Stripe__ApiKey: ${STRIPE_API_KEY:?Set STRIPE_API_KEY in .env.prod}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env.prod}
      Stripe__ApiVersion: 2026-07-29.dahlia
      R2__AccountId: ${R2_ACCOUNT_ID:?Set R2_ACCOUNT_ID in .env.prod}
      R2__AccessKeyId: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in .env.prod}
      R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in .env.prod}
      R2__BucketName: ${R2_BUCKET_NAME:?Set R2_BUCKET_NAME in .env.prod}
      Invoice__BusinessName: ${INVOICE_BUSINESS_NAME:?Set INVOICE_BUSINESS_NAME in .env.prod}
      Invoice__BusinessAddress: ${INVOICE_BUSINESS_ADDRESS:?Set INVOICE_BUSINESS_ADDRESS in .env.prod}
      Invoice__BusinessAbn: ${INVOICE_BUSINESS_ABN:?Set INVOICE_BUSINESS_ABN in .env.prod}
      Invoice__BusinessEmail: ${INVOICE_BUSINESS_EMAIL:?Set INVOICE_BUSINESS_EMAIL in .env.prod}
      Billing__GracePeriodDays: ${BILLING_GRACE_PERIOD_DAYS:-7}
      Billing__RefundAction: ${BILLING_REFUND_ACTION:-review}
      Billing__DisputeAction: ${BILLING_DISPUTE_ACTION:-review}
      CustomerPortal__PublicBaseUrl: ${CUSTOMER_PORTAL_PUBLIC_BASE_URL:?Set CUSTOMER_PORTAL_PUBLIC_BASE_URL in .env.prod}
      # Caddy is the only hop in front of this container (see the "edge" network below); trust
      # exactly that network's subnet rather than an individual container IP, which can change
      # across recreates.
      Security__ForwardedHeaders__KnownNetworks__0: ${FORWARDED_HEADERS_KNOWN_NETWORK:-172.28.0.0/24}
      RESET_ADMIN_PASSWORD: ${RESET_ADMIN_PASSWORD:-false}
      # Deliberately not setting ASPNETCORE_FORWARDEDHEADERS_ENABLED: see compose.yaml's identical
      # comment. Only Program.cs's gated app.UseForwardedHeaders() call should add this middleware.
    volumes:
      - license-data-protection:/var/lib/licenseserver/data-protection
      - ${LICENSE_SIGNING_KEY_DIR:?Set LICENSE_SIGNING_KEY_DIR in .env.prod}:/var/lib/licenseserver/keys:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    networks:
      - db
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env.prod}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    networks:
      - edge

volumes:
  license-postgres:
  license-data-protection:
  caddy-data:
  caddy-config:

networks:
  # postgres + app only. internal:true means neither container has any route out of this
  # network at all, including to the internet - the app's Stripe/MailerSend calls go out via
  # the "edge" network below instead.
  db:
    internal: true
  # app + caddy. Not internal: the app needs outbound HTTPS for Stripe/MailerSend, and this is
  # also the only network caddy joins, so it's the sole path from the host into the stack.
  # Subnet is pinned so FORWARDED_HEADERS_KNOWN_NETWORK above stays valid across recreates.
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
