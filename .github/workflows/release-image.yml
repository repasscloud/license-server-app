name: Release container image

# Triggered only by pushing a version tag (e.g. `git tag -a -S -m "v1.2.3" v1.2.3 && git push origin v1.2.3`),
# not by ordinary branch pushes. GitHub does not verify the `-S` GPG signature for trigger
# purposes; it only matters that the ref name matches vX.Y.Z.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # also needed to create the GitHub release below
  packages: write

env:
  IMAGE_NAME: license-server-app

jobs:
  # Gate that both other jobs depend on, so a bad tag (not on main, or missing a changelog
  # entry) fails fast instead of burning a Windows runner on the native-AOT job below.
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history needed for the main-ancestry check below

      # The tags trigger above fires for a matching tag pushed from anywhere; it has no
      # concept of "main". This step enforces that requirement by checking that the
      # tagged commit is actually reachable from main before anything gets published.
      - name: Require tag to point at a commit on main
        env:
          TAG_NAME: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag $TAG_NAME (commit $TAG_COMMIT) is not on main; refusing to release." >&2
            exit 1
          fi

      # CHANGELOG.md follows Keep a Changelog: "## [X.Y.Z] - YYYY-MM-DD" headings, one
      # section per release. Pulling the section for this tag's version out now, before
      # anything is built, means a missing changelog entry fails fast instead of leaving
      # a pushed image with no matching release notes.
      - name: Extract changelog section for this release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if ($0 == "## [" ver "]" || index($0, "## [" ver "] - ") == 1) { found = 1; next }
              next
            }
            # Stop before the trailing "[label]: url" reference-link block at the end of
            # the file, in case this version is ever the last section (e.g. the oldest
            # release, or CHANGELOG entries added in reverse of the usual order).
            found && /^\[.*\]: / { exit }
            found && !started && /^[[:space:]]*$/ { next } # drop the blank line right after the heading
            found { started = 1; print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No '## [$version]' section found in CHANGELOG.md for tag $TAG_NAME." >&2
            echo "Add a dated changelog section for this version before tagging." >&2
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  # win-x64 Native AOT can only be produced on a Windows host - ilcompiler does not support
  # cross-compiling from Linux to Windows - so this build runs on its own Windows runner while
  # linux-x64/linux-arm64 build in the `release` job below.
  windows-natives:
    name: Build Windows native binaries
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json

      # LicenseGenerator and LicenseValidator are the standalone CLIs users run to issue and
      # check licence files; Native AOT gives a single dependency-free executable per RID
      # instead of a self-contained folder full of runtime DLLs.
      - name: Build and package win-x64 native binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          foreach ($proj in @("LicenseGenerator", "LicenseValidator")) {
            $csproj = "src/$proj/$proj.csproj"
            $version = (Select-String -Path $csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
            $stageName = "$proj-$version-win-x64"
            $stageDir = "artifacts/publish/$stageName"
            New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

            dotnet publish $csproj -c Release -r win-x64 -p:PublishAot=true -o $stageDir
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $proj" }

            Copy-Item README.md, CHANGELOG.md, LICENSE -Destination $stageDir

            Compress-Archive -Path $stageDir -DestinationPath "artifacts/publish/$stageName.zip" -Force

            tar -czf "artifacts/publish/$stageName.tar.gz" -C artifacts/publish $stageName
            if ($LASTEXITCODE -ne 0) { throw "tar failed for $proj" }

            Copy-Item "artifacts/publish/$stageName.zip", "artifacts/publish/$stageName.tar.gz" -Destination release-assets
          }

      - name: Upload win-x64 release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-assets
          path: release-assets/*
          retention-days: 1

  release:
    name: Build and push image
    needs: [validate, windows-natives]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      # ghcr.io rejects mixed-case paths; the GitHub org for this repo (repasscloud)
      # is not all lowercase, so the owner segment has to be normalized before use.
      - name: Lowercase the image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json

      # Native AOT builds (including the native linux-x64 target below) need clang.
      # linux-arm64 cross-compilation is disabled for now (see the RID loop below) -
      # even with a proper sysroot (gcc-aarch64-linux-gnu / libc6-dev-arm64-cross) the
      # cross-link kept failing, and it's holding up releases. Revisit later, possibly
      # by building natively on an arm64 runner instead of cross-compiling from x64.
      - name: Install Native AOT toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      # Licensing.Core is what third-party products reference to verify licence files offline
      # (see README "Calling validation directly from an application"). Released alongside the
      # server image so a NuGet package and a plain DLL are both pullable straight from the
      # GitHub release, without anyone needing to clone and build this repo themselves.
      #
      # The tag (vX.Y.Z) only versions the container image below. Every attached asset is
      # versioned from its own project's <Version> in its .csproj, not the tag, since the
      # library/tool release cadence is independent of the server's.
      - name: Build and package Licensing.Core
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Licensing.Core/Licensing.Core.csproj)
          mkdir -p artifacts/nuget artifacts/dll/"Licensing.Core-$VERSION" release-assets

          dotnet pack src/Licensing.Core/Licensing.Core.csproj \
            -c Release \
            -o artifacts/nuget

          dotnet build src/Licensing.Core/Licensing.Core.csproj \
            -c Release

          cp src/Licensing.Core/bin/Release/net10.0/Licensing.Core.dll \
             artifacts/dll/"Licensing.Core-$VERSION"/

          ( cd artifacts/dll && zip -r "Licensing.Core-$VERSION.zip" "Licensing.Core-$VERSION" )
          ( cd artifacts/dll && tar -czf "Licensing.Core-$VERSION.tar.gz" "Licensing.Core-$VERSION" )
          rm -rf artifacts/dll/"Licensing.Core-$VERSION"

          cp artifacts/nuget/*.nupkg release-assets/
          cp artifacts/dll/*.zip artifacts/dll/*.tar.gz release-assets/

      # LicenseGenerator and LicenseValidator are the standalone CLIs users run to issue and
      # check licence files; Native AOT gives a single dependency-free executable per RID
      # instead of a self-contained folder full of runtime DLLs. win-x64 is built separately
      # on a Windows runner (see the `windows-natives` job) since AOT can't cross-compile to
      # Windows from here.
      - name: Build and package Linux native binaries
        run: |
          set -euo pipefail
          for PROJ in LicenseGenerator LicenseValidator; do
            CSPROJ="src/$PROJ/$PROJ.csproj"
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' "$CSPROJ")

            # TODO: re-add linux-arm64 once cross-compilation is sorted out (AOT
            # cross-linking to arm64 keeps failing even with a proper sysroot). For now
            # this only publishes linux-x64.
            for RID in linux-x64; do
              STAGE_NAME="$PROJ-$VERSION-$RID"
              STAGE_DIR="artifacts/publish/$STAGE_NAME"
              mkdir -p "$STAGE_DIR"

              dotnet publish "$CSPROJ" \
                -c Release \
                -r "$RID" \
                -p:PublishAot=true \
                -o "$STAGE_DIR"

              cp README.md CHANGELOG.md LICENSE "$STAGE_DIR"/

              ( cd artifacts/publish && zip -r "$STAGE_NAME.zip" "$STAGE_NAME" )
              ( cd artifacts/publish && tar -czf "$STAGE_NAME.tar.gz" "$STAGE_NAME" )

              cp artifacts/publish/"$STAGE_NAME.zip" artifacts/publish/"$STAGE_NAME.tar.gz" release-assets/
            done
          done

      # Full source snapshot for this release, named after the container tag since it isn't
      # tied to any single project's version. bin/obj build output is excluded — it's not source.
      - name: Archive src directory
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          zip -r "release-assets/src-$TAG_NAME.zip" src -x '*/bin/*' -x '*/obj/*'
          tar -czf "release-assets/src-$TAG_NAME.tar.gz" \
            --exclude='bin' --exclude='obj' \
            src

      - name: Download win-x64 release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-assets
          path: release-assets

      - name: Generate checksums
        run: |
          set -euo pipefail
          ( cd release-assets && sha256sum * > SHA256SUMS.txt )
          ( cd release-assets && sha256sum -c SHA256SUMS.txt )

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}:latest

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file release-notes.md \
            release-assets/*
